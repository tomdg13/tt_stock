name: atm_stock_app
description: ATM stock / terminal management app
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.0
  image_picker: ^1.2.4
  mobile_scanner: ^7.4.2
  http_parser: ^4.1.2
  file_picker: ^13.3.2
  url_launcher: ^6.3.3
  google_mlkit_text_recognition: ^0.17.1
  image: ^4.12.0
  image_cropper: ^13.0.0
  google_mlkit_subject_segmentation: ^0.2.1
  local_auth: ^3.0.2
  flutter_secure_storage: ^11.2.0
  archive: ^4.6.0
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  printing: ^5.15.1
  dio: ^5.11.1
  pdf: ^3.13.1
  cupertino_icons: ^2.0.0
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  assets:
    - assets/fonts/
    - assets/ldb/
  uses-material-design: true
  config:
    enable-swift-package-manager: false
